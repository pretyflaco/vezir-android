name: ci

# v0.3.2: first CI workflow for vezir-android.  Three rungs of the
# "introduce automation" ladder, all in one workflow (the Gradle build
# is naturally an everything-or-nothing job, so splitting them across
# workflows costs more cache misses than it saves):
#
#   1. ./gradlew lint              (gated; lint-baseline.xml absorbs the
#      historical backlog — 0 findings as of v0.5.x)
#   2. ./gradlew testDebugUnitTest (gated; all green since the
#      EnrollmentPayloadTest fix)
#   3. ./gradlew assembleDebug     (proves the app still builds)
#
# Release builds are NOT done in CI — release signing requires
# keystore.properties (gitignored) and we ship APKs manually from a
# developer machine.  Adding signed-release builds to CI would mean
# committing the keystore password to GitHub secrets; deferred until
# we actually want CI-built releases.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: lint + unit tests + assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # JDK 17 matches app/build.gradle.kts:82-88
          # (sourceCompatibility = VERSION_17, jvmTarget = "17").
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        # setup-gradle handles dependency / wrapper / configuration-cache
        # caching automatically; no per-PR opt-in needed.
        uses: gradle/actions/setup-gradle@v4

      - name: Android lint
        # v0.5.4: gated.  A `lint{ baseline = lint-baseline.xml }` block
        # in app/build.gradle.kts records the historical findings (0 as of
        # v0.5.x — the codebase was already clean), so this fails CI only
        # on NEW lint regressions.  Regenerate the baseline by deleting
        # app/lint-baseline.xml and re-running `./gradlew lint`.
        run: ./gradlew --no-daemon lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Unit tests
        # v0.5.4: gated.  The previously-flaky EnrollmentPayloadTest was
        # fixed (it asserted v=2 unsupported when v2 *is* supported;
        # switched to v=99).  The full suite is green, so CI now fails on
        # any unit-test regression.
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK artifact
        # Makes the freshly-built debug APK downloadable from the
        # Actions UI for ad-hoc dogfood without needing a release.
        uses: actions/upload-artifact@v4
        with:
          name: vezir-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
